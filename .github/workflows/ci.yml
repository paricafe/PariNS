name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: ./target/release/parins --config parins.example.toml --check
      - name: Installer fixture tests
        run: |
          sh -n scripts/install.sh scripts/test-install.sh scripts/test-systemd.sh scripts/package.sh scripts/bootstrap.sh scripts/test-bootstrap.sh
          sh scripts/test-install.sh
          sh scripts/test-bootstrap.sh
      - name: Web management checks
        run: |
          for file in web/*.js; do node --check "$file"; done
          node --test scripts/test-web.mjs
      - name: Linux managed service acceptance
        if: runner.os == 'Linux'
        run: sh scripts/test-systemd.sh --ephemeral-ci
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Packaging smoke
        run: sh scripts/package.sh
