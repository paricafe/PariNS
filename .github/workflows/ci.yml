name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test management console
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --registry https://registry.npmjs.org --audit-level=high
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Release notes regression
        run: node --test scripts/test-release-notes.mjs scripts/test-update-manifest.mjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Isolated UDP source-address acceptance
        if: runner.os == 'Linux'
        run: sh scripts/test-udp.sh --ephemeral-ci
      - run: cargo build --locked --release
      - run: ./target/release/parins --config parins.example.toml --check
      - name: Installer fixture tests
        run: |
          for script in scripts/install.sh scripts/test-install.sh scripts/test-systemd.sh scripts/test-udp.sh scripts/package.sh scripts/bootstrap.sh scripts/test-bootstrap.sh; do
            sh -n "$script"
          done
          sh scripts/test-install.sh
          sh scripts/test-bootstrap.sh
      - name: Linux managed service acceptance
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          # The managed updater accepts only the native static release contract.
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --bins --target x86_64-unknown-linux-musl
          sh scripts/test-systemd.sh --ephemeral-ci --binary-path "$PWD/target/x86_64-unknown-linux-musl/release/parins"
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Packaging smoke
        run: sh scripts/package.sh
