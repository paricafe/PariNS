name: Filter lifecycle acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
# One mutable, synthetic HTTPS source is shared by these manual measurements.
concurrency:
  group: filter-lifecycle-source
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PARINS_OFFICIAL_RELEASE: '0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fixture checks
        run: |
          sh -n scripts/test-systemd.sh
          node --check scripts/test-filter-lifecycle.mjs
          node scripts/test-filter-lifecycle.mjs --self-test
      - name: Build native package
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          version="v$(cargo pkgid --locked | sed 's/.*[@#]//')"
          sh scripts/package.sh --version "$version" --target x86_64-unknown-linux-musl
          mkdir -p target/filter-lifecycle-package
          tar -xzf "target/packages/parins-$version-linux-x86_64.tar.gz" -C target/filter-lifecycle-package
      - name: Three fixed 2 GiB lifecycle and recovery rounds
        run: |
          version="v$(cargo pkgid --locked | sed 's/.*[@#]//')"
          sh scripts/test-systemd.sh --ephemeral-ci --package "$PWD/target/filter-lifecycle-package/parins-$version-linux-x86_64" --filter-lifecycle
      - name: Preserve sanitized measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filter-lifecycle-${{ github.sha }}
          if-no-files-found: warn
          path: artifacts/filter-lifecycle/
