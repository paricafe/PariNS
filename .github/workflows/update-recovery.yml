name: Update boot recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-update-reboot*.py'
      - '.github/workflows/update-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-boot-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PARINS_OFFICIAL_RELEASE: '0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pure fixture checks
        run: python3 -B scripts/test-update-reboot-tests.py
      - name: Native package and isolated VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools binutils qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          rustup target add x86_64-unknown-linux-musl
          version="v$(cargo pkgid --locked | sed 's/.*[@#]//')"
          # package.sh builds/tests the exact Web assets before embedding Rust.
          sh scripts/package.sh --version "$version" --target x86_64-unknown-linux-musl
          mkdir -p target/update-recovery-package
          tar -xzf "target/packages/parins-$version-linux-x86_64.tar.gz" -C target/update-recovery-package
          python3 -B scripts/test-update-reboot.py --ephemeral-ci --package "$PWD/target/update-recovery-package/parins-$version-linux-x86_64"
      - name: Preserve only sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-boot-recovery-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/parins-up6-results/result.json
