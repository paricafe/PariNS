[package]
name = "parins"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A self-hosted DNS forwarder with subnet-aware caching and browser management"
repository = "https://github.com/paricafe/PariNS"
publish = false
default-run = "parins"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
httpdate = "1"
idna = "1"
ipnet = "2"
lru = "0.18.4"
rand = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "hooks", "fallible_uint", "limits"] }
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
url = "2"
webpki-roots = "1"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net", "uio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
