[package]
name = "parins"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A DNS forwarder for Pari Public DNS"
repository = "https://github.com/paricafe/PariNS"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
ipnet = "2"
lru = "0.18.4"
rand = "0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
