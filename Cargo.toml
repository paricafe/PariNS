[package]
name = "parins"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A DNS forwarder for Pari Public DNS"
repository = "https://github.com/paricafe/PariNS"
publish = false

[dependencies]
anyhow = "1"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
ipnet = "2"
lru = "0.18.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
