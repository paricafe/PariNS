# Local development: run a separate DNS upstream on port 5354,
# or replace upstream with the IP:port of your chosen resolver.
listen = "127.0.0.1:5353"
upstream = "127.0.0.1:5354"
query_timeout_ms = 2000
tcp_io_timeout_ms = 5000
shutdown_grace_ms = 3000
max_inflight = 256
max_tcp_connections = 64
# Optional paths resolve relative to this configuration file.
# filter_file = "rules.toml" # authoritative instead of the inline [filter]
# admin_listen = "127.0.0.1:9090" # local /metrics and /healthz only

# Enable encrypted listeners individually with your own certificate/key.
# [dot]
# listen = "127.0.0.1:8530"
# cert_file = "server.pem"
# key_file = "server.key"
# [doh]
# listen = "127.0.0.1:8443"
# cert_file = "server.pem"
# key_file = "server.key"
# [doq]
# listen = "127.0.0.1:8530" # UDP, distinct from DoT's TCP socket
# cert_file = "server.pem"
# key_file = "server.key"
# [doh3]
# listen = "127.0.0.1:8443" # UDP, distinct from DoH2's TCP socket
# cert_file = "server.pem"
# key_file = "server.key"

# Authenticate the fixed `upstream` IP over DoT; no plaintext downgrade.
# [upstream_tls]
# server_name = "resolver.example"
# ca_file = "private-ca.pem" # omit for built-in WebPKI roots

# Opt-in ONLY for replicas with equivalent ECS/DNSSEC/answer policies.
# Threshold is an operator choice informed by measured latency, not auto-tuning.
# [scheduler]
# secondary = "127.0.0.1:5355"
# hedge_after_ms = 50
# max_extra_inflight = 32

# Opt in only when the upstream supports ECS and this privacy policy is desired.
[ecs]
enabled = false
ipv4_prefix = 24
ipv6_prefix = 56

[cache]
enabled = true
max_entries = 4096
# Serialized answers + charged key bytes, not total process RSS.
max_bytes = 8388608
max_variants = 64
max_ttl_secs = 3600
negative_ttl_cap_secs = 300

# Local ASCII names only; suffix includes the name itself and its subdomains.
# Any matching allow wins for that name, but not for a different CNAME target.
[filter]
enabled = false
block_exact = []
block_suffix = []
allow_exact = []
allow_suffix = []

[coalescing]
enabled = true
max_groups = 128
# Includes the first caller. The server max_inflight budget still applies.
max_waiters = 64

[metrics]
# 0 disables aggregate JSON stderr output; 1..3600 enables periodic/final snapshots.
interval_secs = 0
