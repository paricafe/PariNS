# Local development: run a separate DNS upstream on port 5354,
# or replace upstreams.servers with your chosen resolver(s).
listen = "127.0.0.1:5353"
query_timeout_ms = 2000
tcp_io_timeout_ms = 5000
shutdown_grace_ms = 3000
max_inflight = 256
max_tcp_connections = 64

# Optional source budgets shared across all DNS listeners (socket peer only).
# [source_limits]
# enabled = true
# rate_per_sec = 100
# burst = 200
# max_sources = 4096
# max_inflight = 32
# max_connections = 8 # includes pending TLS/QUIC handshakes
# ipv4_prefix = 32
# ipv6_prefix = 64 # rotating addresses in a /64 share a budget
# Optional paths resolve relative to this configuration file.
# filter_file = "rules.toml" # authoritative instead of the inline [filter]
# admin_listen = "127.0.0.1:9090" # local /metrics and /healthz only

# Enable encrypted listeners individually with your own certificate/key.
# [dot]
# listen = "127.0.0.1:8530"
# cert_file = "server.pem"
# key_file = "server.key"
# [doh]
# listen = "127.0.0.1:8443"
# http3 = true # H3 uses UDP on this same address/port; H2 uses TCP
# cert_file = "server.pem"
# key_file = "server.key"
# [doq]
# listen = "127.0.0.1:8530" # UDP, distinct from DoT's TCP socket
# cert_file = "server.pem"
# key_file = "server.key"

# Managed mode only: check the official stable release, never install automatically.
# File mode does not start the update checker. Interval range: 1..168 hours.
[updates]
auto_check = true
check_interval_hours = 6

# One or more equivalent upstreams; never point back to a PariNS listener.
# Supports IP[:port], udp://, tcp://, tls://, https://host/dns-query, quic://.
# Append weight=N to an endpoint for weighted balancing.
[upstreams]
servers = ["udp://127.0.0.1:5354"]
mode = "weighted" # or parallel (first NOERROR/NXDOMAIN; errors are fallback)
prefer_h3 = false # HTTPS only: prefer HTTP/3, fall back to verified HTTP/2
bootstrap = [] # hostname URLs require explicit bootstrap IP:port addresses
max_parallel = 32
max_extra_inflight = 128
# ca_file = "private-ca.pem" # omit for built-in WebPKI roots

# Optional authenticated DoT connection reuse, independently per tls:// endpoint.
[upstreams.dot_pool]
enabled = false
max_connections = 8
idle_timeout_ms = 30000

# Opt in only when the upstream supports ECS and this privacy policy is desired.
[ecs]
enabled = false
ipv4_prefix = 24
ipv6_prefix = 56

[cache]
enabled = true
max_entries = 4096
# Serialized answers + conservative entry metadata, not total process RSS.
max_bytes = 8388608
max_variants = 64
max_ttl_secs = 3600
negative_ttl_cap_secs = 300
shards = 4
negative_percent = 20

[cache.prefetch]
enabled = false
min_hits = 3
remaining_percent = 10
max_inflight = 2
rate_per_sec = 10
backoff_secs = 5

[cache.stale]
enabled = false
retention_secs = 300
reply_ttl_secs = 30

# Fresh cache restoration after clean process shutdown, never periodic snapshots.
[cache.persistence]
enabled = true
max_bytes = 33554432

# Optional per-domain policies; exact before suffix, then most labels, qtype,
# then first declaration. Missing optional fields inherit global cache settings.
# [[cache.rules]]
# name = "dynamic.example"
# suffix = true
# qtype = "A"
# max_ttl_secs = 60
# stale = false

# Local ASCII names only; suffix includes the name itself and its subdomains.
# Any matching allow wins for that name, but not for a different CNAME target.
[filter]
enabled = false
block_exact = []
block_suffix = []
allow_exact = []
allow_suffix = []

[coalescing]
enabled = true
max_groups = 128
# Includes the first caller. The server max_inflight budget still applies.
max_waiters = 64

[metrics]
# 0 disables aggregate JSON stderr output; 1..3600 enables periodic/final snapshots.
interval_secs = 0

# Opt-in private browsing metadata, persisted asynchronously in the runtime DB.
[query_log]
enabled = false
max_entries = 1000
max_bytes = 67108864
retention_secs = 86400
